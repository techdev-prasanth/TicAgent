global:

  scrape_interval: 15s


scrape_configs:

  # ============================================================
  # Prometheus itself
  # ============================================================
  - job_name: prometheus

    static_configs:

      - targets:
          - prometheus:9090


  # ============================================================
  # OpenTelemetry Collector
  # ============================================================
  - job_name: otel-collector

    static_configs:

      - targets:
          - otel-collector:8889